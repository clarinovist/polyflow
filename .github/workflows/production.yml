name: Production Pipeline

on:
  # Deploy the newest verified Push CI artifact on weekdays.
  schedule:
    - cron: '17 14 * * 1-5'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

permissions:
  contents: read
  actions: read

jobs:
  # Release automation remains scheduled and independent from deployment.
  release-please:
    name: Release Please
    needs: agents-consistency
    if: ${{ needs.agents-consistency.outputs.full == 'true' && github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Lightweight policy guard only. No dependency install, test, or image build.
  agents-consistency:
    name: AGENTS.md Consistency
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run AGENTS.md consistency check
        run: bash scripts/check-agents-consistency.sh
      - name: Check Node version consistency
        run: bash scripts/check-node-version.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Pilih jalur dan periksa dokumen aman
        id: changes
        run: node scripts/ci/changes.mjs

  # Select an exact successful Push CI release artifact. If current HEAD is
  # docs-only, the latest full ancestor is allowed only when every intervening
  # path is in the explicit safe-document allowlist.
  release-readiness:
    name: Verified Push Artifact Readiness
    needs: agents-consistency
    if: ${{ needs.agents-consistency.outputs.full == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.readiness.outputs.run-id }}
      run-attempt: ${{ steps.readiness.outputs.run-attempt }}
      release-sha: ${{ steps.readiness.outputs.release-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select verified Push CI artifact
        id: readiness
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/ci/release-readiness.cjs').check({ github, context, core });

  # Download only the manifest emitted by the approved Push CI run and validate
  # its repository/SHA/run/attempt/digest identity before deployment.
  release-artifact:
    name: Verify Release Artifact
    needs: release-readiness
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    outputs:
      release-sha: ${{ steps.manifest.outputs.release-sha }}
      digest: ${{ steps.manifest.outputs.digest }}
      worker-digest: ${{ steps.manifest.outputs.worker-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.release-readiness.outputs.run-id }}-${{ needs.release-readiness.outputs.run-attempt }}-${{ needs.release-readiness.outputs.release-sha }}
          path: release-evidence
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-readiness.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release manifest identity
        id: manifest
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-readiness.outputs.release-sha }}
          EXPECTED_RUN_ID: ${{ needs.release-readiness.outputs.run-id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.release-readiness.outputs.run-attempt }}
        run: node scripts/ci/release-artifact.cjs verify release-evidence/manifest.json

  # Production consumes evidence; it never recompiles or reruns source tests.
  deploy:
    name: Deploy to VPS
    needs: release-artifact
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject superseded release
        id: revision
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ needs.release-artifact.outputs.release-sha }}
          IMAGE_DIGEST: ${{ needs.release-artifact.outputs.digest }}
          WORKER_IMAGE_DIGEST: ${{ needs.release-artifact.outputs.worker-digest }}
        with:
          script: |
            await require('./scripts/ci/release-guard.cjs').check({ github, context, releaseSha: process.env.RELEASE_SHA, currentSha: context.sha, core, digest: process.env.IMAGE_DIGEST, workerDigest: process.env.WORKER_IMAGE_DIGEST });
      - name: Log in to Container Registry
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
      - name: Promote tested images to :latest
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.REPO }}@${{ needs.release-artifact.outputs.digest }}
          ASSISTANT_WORKER_DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.REPO }}-assistant-worker@${{ needs.release-artifact.outputs.worker-digest }}
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$REPO:latest" \
            "$DEPLOY_IMAGE"
          docker buildx imagetools create \
            --tag "$REGISTRY/$REPO-assistant-worker:latest" \
            "$ASSISTANT_WORKER_DEPLOY_IMAGE"
      - name: Deploy via SSH
        if: steps.revision.outputs.current == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CR_PAT,DEPLOY_SHA,DEPLOY_IMAGE,ASSISTANT_WORKER_DEPLOY_IMAGE,PUBLIC_HEALTH_URL,REGISTRY_USER
          script: |
            set -eu
            [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            [[ "$DEPLOY_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || exit 1
            [[ "$ASSISTANT_WORKER_DEPLOY_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || exit 1
            [[ "$PUBLIC_HEALTH_URL" =~ ^https://[a-z0-9.-]+/api/health$ ]] || exit 1
            cd ~/polyflow
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"
            export POLYFLOW_IMAGE="$DEPLOY_IMAGE"
            export ASSISTANT_WORKER_IMAGE="$ASSISTANT_WORKER_DEPLOY_IMAGE"
            sudo install -d -m 0755 -o 1001 -g 1001 /opt/polyflow-operations
            python3 scripts/write-operations-snapshot.py
            printf '%s' "$CR_PAT" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker compose pull assistant-worker polyflow
            docker compose run --rm --no-deps -T --entrypoint node polyflow scripts/run-product-learning.mjs --preflight
            docker compose run --rm --no-deps -T --entrypoint ./release-migrate.sh polyflow
            docker compose up -d --no-deps --no-build assistant-worker
            for attempt in $(seq 1 30); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' polyflow-assistant-worker)
              [ "$status" = healthy ] && break
              [ "$attempt" -eq 30 ] && { docker logs --tail 100 polyflow-assistant-worker; exit 1; }
              sleep 2
            done
            docker compose up -d --no-deps --no-build polyflow
            for attempt in $(seq 1 60); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' polyflow-app)
              [ "$status" = healthy ] && break
              [ "$attempt" -eq 60 ] && { docker inspect --format '{{json .State}}' polyflow-app; exit 1; }
              sleep 2
            done
            [ "$(docker inspect --format '{{.Config.Image}}' polyflow-app)" = "$DEPLOY_IMAGE" ]
            [ "$(docker inspect --format '{{.Config.Image}}' polyflow-assistant-worker)" = "$ASSISTANT_WORKER_DEPLOY_IMAGE" ]
            curl --fail --silent --show-error --max-time 15 "$PUBLIC_HEALTH_URL"
            python3 scripts/install-product-learning-cron.py
            docker exec polyflow-app node scripts/run-product-learning.mjs
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          DEPLOY_SHA: ${{ needs.release-artifact.outputs.release-sha }}
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.REPO }}@${{ needs.release-artifact.outputs.digest }}
          ASSISTANT_WORKER_DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.REPO }}-assistant-worker@${{ needs.release-artifact.outputs.worker-digest }}
          PUBLIC_HEALTH_URL: https://polyflow.uk/api/health
          REGISTRY_USER: ${{ github.actor }}

  status:
    name: Status CI
    if: ${{ always() }}
    needs: [agents-consistency, release-readiness, release-artifact, deploy, release-please]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Validasi hasil jalur CI
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/changes.mjs status
      - name: Deployment timing report
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/ci/timeline.cjs').report({ github, context, core });
