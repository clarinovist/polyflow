name: Production Pipeline

on:
  push:
    branches:
      - main
  # Manual selalu lengkap, tetapi tidak membuat release PR atau deploy.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Automated Release PR (runs independently)
  # ─────────────────────────────────────────────
  release-please:
    name: Release Please
    needs: agents-consistency
    if: ${{ needs.agents-consistency.outputs.full == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 1b. Palang ringan selalu aktif, tanpa npm ci atau service database.
  #     Klasifikasi fail-safe: hanya allow-list dokumen yang boleh skip job berat.
  # ─────────────────────────────────────────────
  agents-consistency:
    name: AGENTS.md Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run AGENTS.md consistency check
        run: bash scripts/check-agents-consistency.sh
      - name: Check Node version consistency
        run: bash scripts/check-node-version.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Pilih jalur dan periksa dokumen aman
        id: changes
        run: node scripts/ci/changes.mjs

  # ─────────────────────────────────────────────
  # 2a. Lint
  #     Split out of `test` deliberately: ESLint (~74s) and vitest (~166s) share
  #     no output, so running them serially in one job just added ~74s to the
  #     critical path. They now run side by side.
  #     NOTE: `deploy` MUST keep `lint` in its `needs` list — dropping it would
  #     silently demote lint from a deploy gate to a decorative red X.
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    needs: agents-consistency
    if: ${{ needs.agents-consistency.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: node scripts/ci/metrics.mjs install npm ci

      # Required: eslint-config-next type-aware rules resolve imports that
      # include the generated Prisma client. Without this the lint job fails on
      # unresolved types rather than on real violations.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: node scripts/ci/metrics.mjs lint npm run lint

  # ─────────────────────────────────────────────
  # 2b. Tests
  # ─────────────────────────────────────────────
  test-shards:
    name: Test shard ${{ matrix.shard }}
    needs: agents-consistency
    if: ${{ needs.agents-consistency.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            artifact: shard-1
          - shard: '2/2'
            artifact: shard-2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check Node version consistency
        run: bash scripts/check-node-version.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: node scripts/ci/metrics.mjs install npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Record runner and runtime (allowlisted fields only)
        run: node scripts/ci/metrics.mjs hardware
      - name: Run test shard with coverage
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/benchmark.mjs run shards "$SHARD"
      - uses: actions/upload-artifact@v4
        with:
          name: test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.artifact }}
          path: |
            coverage/ci-benchmark/blob.json
            coverage/ci-benchmark/result.json
            coverage/ci-benchmark/metrics.jsonl
          if-no-files-found: error
          retention-days: 14

  # Stable required gate: both shards, global thresholds, then Nginx validation.
  test:
    name: Test & Validate
    needs: [agents-consistency, test-shards]
    if: ${{ always() && needs.agents-consistency.result == 'success' && needs.agents-consistency.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require both test shards
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            printf 'Both test shards must succeed; got: %s\n' "$SHARDS_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Runs before setup-node deliberately: if .nvmrc and the Dockerfile have
      # drifted, fail in ~1s rather than after a full npm ci + test run.
      - name: Check Node version consistency
        run: bash scripts/check-node-version.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: node scripts/ci/metrics.mjs install npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Record runner and runtime (allowlisted fields only)
        run: node scripts/ci/metrics.mjs hardware

      - uses: actions/download-artifact@v4
        with:
          pattern: test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-shard-*
          path: coverage/ci-input
          merge-multiple: false
      - name: Run Tests with Coverage
        run: node scripts/ci/benchmark.mjs merge coverage/ci-input
      - uses: actions/upload-artifact@v4
        with:
          name: test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-merged
          path: |
            coverage/ci-merged/result.json
            coverage/ci-merged/metrics.jsonl
            coverage/ci-merged/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 14

      # Next.js build intentionally NOT run here — the Dockerfile builds it anyway
      # (RUN npm run build), so doing it twice added ~102s to the critical path for
      # an artifact nobody consumed. A broken build now surfaces in build-and-push,
      # which runs in parallel with this job, so time-to-failure did not regress.

      - name: Validate Nginx configuration
        run: |
          mkdir -p certs/live/polyflow.uk
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout certs/live/polyflow.uk/privkey.pem \
            -out certs/live/polyflow.uk/fullchain.pem \
            -subj "/CN=polyflow.uk"
          echo "events {} http { include /etc/nginx/conf.d/*.conf; }" > nginx.conf
          docker run --rm \
            --add-host polyflow-app:127.0.0.1 \
            -v ${{ github.workspace }}/nginx/polyflow.conf:/etc/nginx/conf.d/polyflow.conf:ro \
            -v ${{ github.workspace }}/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v ${{ github.workspace }}/certs:/etc/letsencrypt:ro \
            nginx:alpine nginx -t

  # Real transaction gate for the one-step receipt + receivable workflow.
  return-contract:
    name: Return PostgreSQL Contract
    needs: agents-consistency
    if: ${{ needs.agents-consistency.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RETURN_CREDIT_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:55439/polyflow_return_credit_scope_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/ci/setup-return-test-db.mjs
      - name: Generate route types and validate TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx next typegen && npx tsc --noEmit
      - name: Receipt, credit, proposal and SPK metadata contracts
        run: >-
          npx vitest run --maxWorkers=1 --no-file-parallelism
          src/services/finance/__tests__/quick-sales-return-postgres.test.ts
          src/services/finance/__tests__/return-credit-proposal-postgres.test.ts
          src/services/finance/__tests__/sales-return-receipt-postgres.test.ts
          src/services/finance/__tests__/manual-return-credit-postgres.test.ts
          src/services/finance/__tests__/invoice-status-settlement-postgres.test.ts
          src/services/finance/__tests__/customer-credit-postgres.test.ts
          src/services/production/__tests__/order-context-postgres.test.ts
          src/services/sales/__tests__/trip-distance-postgres.test.ts
          src/actions/finance/__tests__/mobile-readiness-postgres.test.ts

  # ─────────────────────────────────────────────
  # 3. Build & Push Docker Image
  #    Deliberately does NOT `needs: test` — the image build consumes no test
  #    output, so the two run side by side and only `deploy` waits for both.
  #    The image is published under its commit SHA only. `:latest` is applied
  #    later, in `deploy`, once tests are green — otherwise a red test run with a
  #    green build would leave `:latest` pointing at untested code, and the manual
  #    `docker compose pull` recovery path on the VPS would happily deploy it.
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: agents-consistency
    if: ${{ needs.agents-consistency.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:buildcache,mode=max

  # ─────────────────────────────────────────────
  # 4. Deploy to VPS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [test, lint, build-and-push, return-contract]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject superseded release
        id: revision
        uses: actions/github-script@v8
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        with:
          script: |
            await require('./scripts/ci/release-guard.cjs').check({ github, context, core, digest: process.env.IMAGE_DIGEST });
      # `needs` above is the real gate: this job only starts when tests AND lint
      # are green AND the image exists. Promoting the tag here is what keeps
      # `:latest` a "tested" marker rather than merely a "built" one.
      - name: Log in to Container Registry
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Promote tested image to :latest
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.REPO }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$REPO:latest" \
            "$DEPLOY_IMAGE"

      - name: Deploy via SSH
        if: steps.revision.outputs.current == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CR_PAT,DEPLOY_SHA,DEPLOY_IMAGE,REGISTRY_USER
          script: |
            set -eu
            [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            [[ "$DEPLOY_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || exit 1
            cd ~/polyflow
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"
            export POLYFLOW_IMAGE="$DEPLOY_IMAGE"
            printf '%s' "$CR_PAT" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker compose pull polyflow
            docker compose up -d --no-deps --no-build polyflow
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.REPO }}@${{ needs.build-and-push.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}

  # Status lintas jalur: merah bila gate gagal/cancelled/skip di luar rencana.
  status:
    name: Status CI
    if: ${{ always() }}
    needs: [agents-consistency, test-shards, test, lint, build-and-push, return-contract, deploy, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Validasi hasil jalur CI
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/changes.mjs status

  # Observability only, never a replacement for deploy's required gates.
  timing:
    name: Pipeline timing
    if: ${{ always() && needs.agents-consistency.outputs.full == 'true' }}
    needs: [test-shards, test, lint, build-and-push, return-contract, deploy, agents-consistency, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/ci/timeline.cjs').report({ github, context, core });
