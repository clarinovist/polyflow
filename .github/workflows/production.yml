name: Production Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Automated Release PR (runs independently)
  # ─────────────────────────────────────────────
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 1b. AGENTS.md docs consistency (parallel, non-blocking)
  #     Fails the run (red X) if module AGENTS.md drift, but does
  #     NOT gate deploy — nothing `needs` this job.
  # ─────────────────────────────────────────────
  agents-consistency:
    name: AGENTS.md Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run AGENTS.md consistency check
        run: bash scripts/check-agents-consistency.sh

  # ─────────────────────────────────────────────
  # 2. Tests
  # ─────────────────────────────────────────────
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests with Coverage
        run: npx vitest run --coverage

      # Next.js build intentionally NOT run here — the Dockerfile builds it anyway
      # (RUN npm run build), so doing it twice added ~102s to the critical path for
      # an artifact nobody consumed. A broken build now surfaces in build-and-push,
      # which runs in parallel with this job, so time-to-failure did not regress.

      - name: Validate Nginx configuration
        run: |
          mkdir -p certs/live/polyflow.uk
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout certs/live/polyflow.uk/privkey.pem \
            -out certs/live/polyflow.uk/fullchain.pem \
            -subj "/CN=polyflow.uk"
          echo "events {} http { include /etc/nginx/conf.d/*.conf; }" > nginx.conf
          docker run --rm \
            --add-host polyflow-app:127.0.0.1 \
            -v ${{ github.workspace }}/nginx/polyflow.conf:/etc/nginx/conf.d/polyflow.conf:ro \
            -v ${{ github.workspace }}/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v ${{ github.workspace }}/certs:/etc/letsencrypt:ro \
            nginx:alpine nginx -t

  # ─────────────────────────────────────────────
  # 3. Build & Push Docker Image
  #    Deliberately does NOT `needs: test` — the image build consumes no test
  #    output, so the two run side by side and only `deploy` waits for both.
  #    The image is published under its commit SHA only. `:latest` is applied
  #    later, in `deploy`, once tests are green — otherwise a red test run with a
  #    green build would leave `:latest` pointing at untested code, and the manual
  #    `docker compose pull` recovery path on the VPS would happily deploy it.
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:buildcache,mode=max

  # ─────────────────────────────────────────────
  # 4. Deploy to VPS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # `needs` above is the real gate: this job only starts when the tests are
      # green AND the image exists. Promoting the tag here is what keeps `:latest`
      # a "tested" marker rather than merely a "built" one.
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Promote tested image to :latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.REPO }}:latest \
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CR_PAT
          script: |
            set -e
            cd /root/polyflow
            git fetch origin main
            git reset --hard origin/main
            echo "$CR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull polyflow
            docker rm -f polyflow-app 2>/dev/null || true
            docker compose up -d --no-deps polyflow
            docker image prune -f
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
