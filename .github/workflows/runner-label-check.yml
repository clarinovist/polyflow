name: Runner label check (temporary)

# Temporary probe dispatched before production.yml adopts ubuntu-26.04.
# Confirms the dated label is actually schedulable on GitHub-hosted runners.
# Delete this file once the switch lands.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        label: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Report runner image
        run: |
          set -eu
          . /etc/os-release
          printf 'label=%s os=%s kernel=%s\n' '${{ matrix.label }}' "$PRETTY_NAME" "$(uname -r)"
          docker --version
          docker buildx version
